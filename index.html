<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Similarity Checker</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
            font-size: 28px;
        }

        .text-areas {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #e0e0e0;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #ff512f;
            background: linear-gradient(to right, #ff512f, #dd2476);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(0.99);
        }

        .results {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 8px;
            display: none;
            /* Hidden by default */
        }

        .stat-box {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .stat-item h3 {
            color: #4facfe;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .stat-item p {
            font-size: 24px;
            font-weight: bold;
        }

        .highlight-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .highlight {
            color: #00ff88;
            font-weight: bold;
            background: rgba(0, 255, 136, 0.1);
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Text Similarity & Plagiarism Checker</h1>

        <div class="text-areas">
            <div class="box">
                <label>Student Document 1</label>
                <textarea id="text1" placeholder="Paste first text here..."></textarea>
            </div>
            <div class="box">
                <label>Student Document 2</label>
                <textarea id="text2" placeholder="Paste second text here..."></textarea>
            </div>
        </div>

        <button onclick="checkPlagiarism()">Analyze Similarity (LCS Algorithm)</button>

        <div class="results" id="resultsBox">
            <div class="stat-box">
                <div class="stat-item">
                    <h3>Similarity Percentage</h3>
                    <p id="simScore">0%</p>
                </div>
                <div class="stat-item">
                    <h3>Matching Characters (LCS Length)</h3>
                    <p id="lcsLen">0</p>
                </div>
            </div>
            <div class="stat-item">
                <h3>Extracted Matching Subsequence</h3>
                <div class="highlight-box" id="matchText"></div>
            </div>
        </div>
    </div>

    <script>
        async function checkPlagiarism() {
            const text1 = document.getElementById("text1").value;
            const text2 = document.getElementById("text2").value;

            if (!text1 || !text2) {
                alert("Please enter text in both documents!");
                return;
            }

            // Send POST request to our Java Server
            try {
                const response = await fetch("http://localhost:8080/api/compare", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        text1: text1.replace(/\n/g, "\\n"),
                        text2: text2.replace(/\n/g, "\\n")
                    })
                });

                const data = await response.json();

                if (data.status === "success") {
                    document.getElementById("resultsBox").style.display = "block";

                    // Color coding based on percentage
                    const scoreEle = document.getElementById("simScore");
                    scoreEle.innerText = data.similarity + "%";
                    if (data.similarity > 50) scoreEle.style.color = "#ff4d4d"; // High Plagiarism (Red)
                    else scoreEle.style.color = "#00ff88"; // Safe (Green)

                    document.getElementById("lcsLen").innerText = data.lcsLength;

                    // Show matched text
                    document.getElementById("matchText").innerHTML = `<span class="highlight">${data.matchedText}</span>`;
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert("Server connection failed! Make sure Main.java is running on port 8080.");
            }
        }
    </script>

</body>

</html>
